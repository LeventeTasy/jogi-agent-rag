jogi_strategiai_tervezes_feladat:
  description: >
    Elemezd a felhasználó által feltett kérdést a(z) {topic} témakörben, figyelembe véve az eddigi chat history-t is.
    
    - Vizsgáld meg, hogy a kérdés elég pontos-e, és minden szükséges háttérinformáció (pl. szerződés típusa, státusz, konkrét élethelyzet) rendelkezésre áll-e a pontos jogi válaszhoz. 
    - HA (Hiányos/Homályos a szituáció): Állítsd le a folyamatot! A kimeneted kizárólag egy udvarias, célzott kérdéssor legyen a felhasználó felé, amiben bekéred a hiányzó részleteket.
    - EGYÉBKÉNT (Elég az információ): Bontsd fel a komplex problémát 2-4 specifikus, különálló rész-kérdésre a különböző érintett jogterületek (Ptk., GDPR, Mt. stb.) szerint. Minden rész-kérdést úgy fogalmazz meg, mint egy önálló, célzott jogi keresést, amely alkalmas a RAG keresőmotor számára.
  expected_output: >
    - Ha hiányzik információ: Egy közvetlen kérdéssor a felhasználónak.
    - Ha elegendő az információ: Egy számozott lista, amely KIZÁRÓLAG az optimalizált rész-kérdéseket tartalmazza egymás után, magyarázó szöveg nélkül (pl. "1. [Rész-kérdés a Ptk-hoz] \n 2. [Rész-kérdés a GDPR-hoz]").
  agent: jogi_strategist

jogi_kutatasi_feladat:
  description: >
      Kaptál egy listát az optimalizált rész-kérdésekkel vagy kulcsszavakkal a Jogi Stratégától.

      - KÖTELEZŐ ITERATÍV UTASÍTÁS: Menj végig a kapott rész-kérdések listáján egyenként! A "Jogi adatbázis" toolt 
      - MINDEN EGYES RÉSZ-KÉRDÉSRE KÜLÖN-KÜLÖN, egymás után hívd meg! Ne feltétlenül elégedj meg egyetlen kereséssel! 
      - Futtasd le a toolt az első al-kérdésre, majd a másodikra, és így tovább, hogy minden érintett jogterületet (pl. Ptk., GDPR, Mt.) külön feltérképezz.
      - Az összes lefutott keresés eredményét gyűjtsd össze, és változtatás nélkül, karakterre pontosan másold át a megadott JSON formátumba a háttér-ellenőrzéshez.

  expected_output: >
      Egy érvényes, tiszta JSON lista (markdown kódblokk és magyarázó szöveg nélkül), amely az összes különálló keresés során megtalált jogszabályi hivatkozást tartalmazza az alábbi mezőkkel:
      [
        {{
          "source": "A forrásfájl neve",
          "law": "A törvény pontos megnevezése",
          "page": "Az oldalszám",
          "article": "A szakasz vagy cikk azonosítója",
          "raw_text": "A teljes kinyert szövegblokk",
          "distance": "A vektoros távolság pontszáma"
        }}
      ]
  agent: jogi_researcher

jogszabalyi_megalapozottsag_feladat:
  description: >
    Elemezze a kutató ágens által átadott JSON listát. Hajtson végre mikroszintű szövegelemzést (Statute Grounding): 
    azonosítsa a pontos bekezdéseket, alpontokat, és válassza ki azt a konkrét, szó szerinti mondatot, amely közvetlenül megválaszolja a kérdést. 
    Szűrje ki a releváns cikkeken belüli felesleges bekezdéseket vagy irreleváns utalásokat.
  expected_output: >
    Egy finomított, validált JSON lista, ahol a "quote" mező kizárólag a releváns, hitelesített jogszabályi mondatokat tartalmazza, 
    valamint az "article" mező kiegészül a pontos bekezdésszámmal (pl. 88. cikk (1) bekezdés).
  agent: jogi_grounding_verifier

jogi_tanacsadoi_feladat:
  description: >
    A hitelesített jogszabályi adatok alapján készítse el a végső, formális jogi szakvéleményt.
    
    KÖTELEZŐ SZABÁLYOK:
    1. Jogszabályi levezetés: Az indokolásban explicit módon a pontos bekezdések szövegezésére és szó szerinti fordulataira támaszkodjon. 
       A következtetéseket deduktív módon, a jogszabályhelyek pontos idézésével támassza alá.
    2. Kockázati szűrés (Risk Scan): Vizsgálja felül a saját megfogalmazásait. Ha a szöveg abszolút kijelentéseket tartalmaz 
       (pl. 'mindig', 'soha', 'kizárólag', 'teljes mértékben'), ellenőrizze, hogy a forrásszöveg enged-e meg kivételeket. 
       Az esetleges normatív kivételeket és jogi kockázatokat külön fejezetben kell rögzíteni.
    3. Forrásvalidáció: Csak olyan jogszabályhelyre hivatkozhat, amely bizonyíthatóan szerepel a bemeneti listában.
  expected_output: >
    Egy professzionális, Markdown formátumú jogi tájékoztató jelentés, amely szigorúan az alábbi struktúrát követi:
    
    # JOGI SZAKVÉLEMÉNY: {topic}
    
    ### RÖVID VÁLASZ
    [Egy-két mondatos, kategorikus és egyértelmű válasz a kérdésre: Igen / Nem / Részben]
    
    ### JOGI INDOKOLÁS
    [Részletes, bekezdésekre bontott jogi elemzés, a pontos jogszabályi szövegek explicit beépítésével és levezetésével]
    
    ### JOGSZABÁLYI HIVATKOZÁSOK
    - [Törvény pontos neve] [Pontos cikk/paragrafus és bekezdés megjelölése]
    
    ### KOCKÁZATI TÉNYEZŐK ÉS KIVÉTELEK
    [A kockázati szűrés eredménye: a szabály alkalmazhatóságának korlátai, kivételek. Ha nincs kockázat, a mező értéke: "Nincs."]
    
    A formázás során kódblokk (```) jelölések használata a teljes szövegre tilos!
  agent: jogi_advisor

jogszabalyi_ellenőzési_feladat:
  description: >
    Végezz mikroszintű szöveg-összehasonlítást (Statute Grounding) a Jogi Tanácsadó ágens 
    által generált szakvélemény és a Kutató ágens által a RAG adatbázisból kinyert nyers 
    törvényszövegek (contexts) között. 
    Ellenőrizd, hogy a szakvéleményben szereplő minden egyes állítás, dátum, időtartam és 
    törvényi hivatkozás karakterre pontosan megalapozott-e a forrásadatok által. 
    
    STRUKTÚRÁLT KIVÁLASZTÁSI SZABÁLY:
    - Amennyiben a válasz 100%-ban pontos, nem tartalmaz hallucinációt vagy kiegészítést, 
      a kimeneted KIZÁRÓLAG ezzel a mondattal kezdődjön: "SIKER, ELLENŐZÉS BEFEJEZVE".
    - Amennyiben bármilyen tárgyi tévedést, nem létező hivatkozást, vagy a forrásszöveg által 
      nem alátámasztott állítást találsz, a kimeneted kötelezően ezzel a kulcsszóval kezdődjön: 
      "HIBA ÉSZLELVE!", majd pontokba szedve listázd ki a konkrét kifogásokat és a javítási javaslatokat 
      a Tanácsadó ágens számára.
  expected_output: >
    Egy szöveges audit jelentés, amely kötelezően a "SIKER, ELLENŐZÉS BEFEJEZVE" vagy "HIBA ÉSZLELVE!" kulcsszóval kezdődik, 
    és tartalmazza a részletes hallucináció-ellenőrzési jegyzőkönyvet.
  agent: jogi_fact_checker