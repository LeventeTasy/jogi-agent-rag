inditasi_feladat:
  description: >
    Indítsd el a folyamatot.
  expected_output: >
    Kizrárólag ennyit írj outputba: "OK"
  agent: jogi_strategist

deep_analysis_feladat:
  description: >
    Elemezd a felhasználó által feltett kérdést a(z) {topic} témakörben, figyelembe véve az eddigi chat history-t is: 
    {history}.

    - Vizsgáld meg, hogy a kérdés elég pontos-e, és minden szükséges háttérinformáció (pl. szerződés típusa, státusz, konkrét élethelyzet) rendelkezésre áll-e a pontos jogi válaszhoz. 
    - Hiányos/Homályos a szituáció: A kimeneted kizárólag egy udvarias, célzott kérdéssor legyen a felhasználó felé, amiben bekéred a hiányzó/homályos részleteket, hogy később pontosabban tudjanak a következő ágensek válaszolni.
    - FONTOS: az outputban semmiképpen se adj választ a kérdésre, ne magyarázd meg, ne adj hivatkozásokat, csak az esetleges kérdéseket tedd fel

  expected_output: >
    - FONTOS: az outputban semmiképpen se adj választ a kérdésre, ne magyarázd meg, ne adj hivatkozásokat, csak az esetleges kérdéseket tedd fel
    - "Kérem adjon meg részleteket a leírt szituációról:" majd pedig hozzáteszel egy közvetlen kérdéssort a felhasználónak.
  agent: jogi_strategist

jogi_strategiai_tervezes_feladat:
  description: >
    Elemezd a felhasználó által feltett kérdést a(z) {topic} témakörben, figyelembe véve az eddigi chat history-t is:
    {history}.
    
    Kérlek, vedd figyelembe a felhasználó által megadott plusz körülményeket és részleteket is: "{details}"
    - Bontsd fel a komplex problémát 2-4 specifikus, különálló rész-kérdésre a különböző érintett jogterületek (Ptk., GDPR, Mt. stb.) szerint. Minden rész-kérdést úgy fogalmazz meg, mint egy önálló, célzott jogi keresést, amely alkalmas a RAG keresőmotor számára.
  expected_output: >
    - Egy számozott lista, amely KIZÁRÓLAG az optimalizált rész-kérdéseket tartalmazza egymás után, magyarázó szöveg nélkül (pl. "1. [Rész-kérdés a Ptk-hoz] \n 2. [Rész-kérdés a GDPR-hoz]").
  agent: jogi_strategist

jogi_kutatasi_feladat:
  description: >
      Kaptál egy listát az optimalizált rész-kérdésekkel vagy kulcsszavakkal a Jogi Stratégától.

      - KÖTELEZŐ ITERATÍV UTASÍTÁS: Menj végig a kapott rész-kérdések listáján egyenként! A "Jogi adatbázis" toolt 
      - MINDEN EGYES RÉSZ-KÉRDÉSRE KÜLÖN-KÜLÖN, egymás után hívd meg! Ne feltétlenül elégedj meg egyetlen kereséssel! 
      - Futtasd le a toolt az első al-kérdésre, majd a másodikra, és így tovább, hogy minden érintett jogterületet (pl. Ptk., GDPR, Mt.) külön feltérképezz.
      - Az összes lefutott keresés eredményét gyűjtsd össze, és változtatás nélkül, karakterre pontosan másold át a megadott JSON formátumba a háttér-ellenőrzéshez.

  expected_output: >
      Egy érvényes, tiszta JSON lista (markdown kódblokk és magyarázó szöveg nélkül), amely KÜLÖNÁLLÓ fejezetekre van bontva az 1., 2., 3. és 4. rész-kérdés szerint. 
      Minden egyes rész-kérdéshez TARTOZNIA KELL legalább egy egyedi, külön lefutott keresési eredménynek!:
      [
        {{
          "source": "A forrásfájl neve",
          "law": "A törvény pontos megnevezése",
          "page": "Az oldalszám",
          "article": "A szakasz vagy cikk azonosítója",
          "raw_text": "A teljes kinyert szövegblokk",
          "distance": "A vektoros távolság pontszáma"
        }}
      ]
  agent: jogi_researcher

jogszabalyi_megalapozottsag_feladat:
  description: >
    Elemezze a kutató ágens által átadott JSON listát. Hajtson végre mikroszintű szövegelemzést (Statute Grounding): 
    azonosítsa a pontos bekezdéseket, alpontokat, és válassza ki azt a konkrét, szó szerinti mondatot, amely közvetlenül megválaszolja a kérdést. 
    Szűrje ki a releváns cikkeken belüli felesleges bekezdéseket vagy irreleváns utalásokat.
  expected_output: >
    Egy finomított, validált JSON lista, ahol a "quote" mező kizárólag a releváns, hitelesített jogszabályi mondatokat tartalmazza, 
    valamint az "article" mező kiegészül a pontos bekezdésszámmal (pl. 88. cikk (1) bekezdés). Viszont a "raw_text" teljes mértékben, módosítatlanul megmarad.
  agent: jogi_grounding_verifier

jogi_tanacsadoi_feladat:
  description: >
    A hitelesített jogszabályi adatok alapján készítse el a végső, formális jogi szakvéleményt.
    
    KÖTELEZŐ SZABÁLYOK:
    1. Jogszabályi levezetés: Az indokolásban explicit módon a pontos bekezdések szövegezésére és szó szerinti fordulataira támaszkodjon. 
       A következtetéseket deduktív módon, a jogszabályhelyek pontos idézésével támassza alá.
    2. Kockázati szűrés (Risk Scan): Vizsgálja felül a saját megfogalmazásait. Ha a szöveg abszolút kijelentéseket tartalmaz 
       (pl. 'mindig', 'soha', 'kizárólag', 'teljes mértékben'), ellenőrizze, hogy a forrásszöveg enged-e meg kivételeket. 
       Az esetleges normatív kivételeket és jogi kockázatokat külön fejezetben kell rögzíteni.
    3. Forrásvalidáció: Csak olyan jogszabályhelyre hivatkozhat, amely bizonyíthatóan szerepel a bemeneti listában.
  expected_output: >
    Egy professzionális, Markdown formátumú jogi tájékoztató jelentés, amely szigorúan az alábbi struktúrát követi:
    
    # JOGI SZAKVÉLEMÉNY: {topic}
    
    ### RÖVID VÁLASZ
    [Egy-két mondatos, kategorikus és egyértelmű válasz a kérdésre: Igen / Nem / Részben]
    
    ### JOGI INDOKOLÁS
    [Részletes, bekezdésekre bontott jogi elemzés, a pontos jogszabályi szövegek explicit beépítésével és levezetésével]
    
    ### JOGSZABÁLYI HIVATKOZÁSOK
    - [Törvény pontos neve] [Pontos cikk/paragrafus és bekezdés megjelölése]
    
    ### KOCKÁZATI TÉNYEZŐK ÉS KIVÉTELEK
    [A kockázati szűrés eredménye: a szabály alkalmazhatóságának korlátai, kivételek. Ha nincs kockázat, a mező értéke: "Nincs."]
    
    A formázás során kódblokk (```) jelölések használata a teljes szövegre tilos!
  agent: jogi_advisor

jogszabalyi_ellenőzési_feladat:
  description: >
    Végezz részletes, tényalapú összehasonlítást (Statute Grounding) a Jogi Tanácsadó ágens által 
    generált szakvélemény és a RAG adatbázisból kinyert nyers törvényszövegek (contexts) között.
    
    ELLENŐRZÉSI PROTOKOLL:
    1. PARAGRAFUS- ÉS BEKEZDÉSSZÁMOK: Szigorúan ellenőrizd a törvényhelyek számait! Ha a forrásban 44. § (2) 
       szerepel, de a Tanácsadó 44. § (1)-re hivatkozik, vagy teljesen más paragrafust ír, az kritikus hivatkozási hiba.
    2. TARTALMI MEGFELELŐSÉG: A Tanácsadó fogalmazhat saját szavaival és használhat elfogadott jogi szakkifejezéseket 
       (pl. a 30 napos határidőt nevezheti jogvesztő határidőnek), amennyiben a megállapítás magva hű a forráshoz. 
       Azonban ha a forrás 'alapbér'-t ír, és a Tanácsadó tévesen 'távolléti díj'-ként számolja el, az hiba.
    3. FORRÁSKORLÁTOZÁS: Kritikus hiba kizárólag akkor áll fenn, ha a Tanácsadó olyan konkrét jogszabályra, paragrafusra vagy bekezdésre hivatkozik tényállításként, 
      amely nem támasztható alá a megadott RAG kontextussal. Általános jogi magyarázat vagy következtetés önmagában nem hiba.
    4. Ha egy jogszabály szerepel a RAG-ban, de a Tanácsadó csak összefoglalja, akkor azt helyesnek kell tekinteni,
      nem szükséges szó szerinti idézet.
    
    STRUKTURÁLT JELZÉSI SZABÁLYOK:
    - Ha a szakvélemény ténybelileg pontos, nem tartalmaz rossz számokat vagy forrásidegen törvényeket, 
      a kimeneted kötelezően ezzel a pontos mondattal kezdődjön: "SIKER, ELLENŐZÉS BEFEJEZVE".
    - Ha tárgyi tévedést vagy RAG-en kívüli törvényt találsz, a kimeneted kötelezően ezzel kezdődjön: 
      "HIBA ÉSZLELVE!", majd pontokba szedve, röviden listázd ki a Tanácsadó számára, hogy melyik paragrafust 
      vagy téves állítást kell javítania vagy törölnie.
  expected_output: >
    Egy jogi audit jelentés, amely kötelezően a "SIKER, ELLENŐZÉS BEFEJEZVE" vagy "HIBA ÉSZLELVE!" kulcsszóval kezdődik.
  agent: jogi_fact_checker